# The gate every pull request has to pass before it can merge: tests, lint,
# type checks and a production build. Nothing here deploys, and nothing here
# needs a secret: the tests run against an in-memory Base44 and a fake Stripe.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22.18+ runs the backend's .ts files directly (type stripping).
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint

  typecheck:
    name: Type checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.x
      - run: npm ci --no-audit --no-fund
      # Backend (Deno functions and shared money code): must be clean.
      - run: npm run typecheck:backend
      # Frontend (checkJs): no new errors beyond ci/typecheck-baseline.json.
      - run: npm run typecheck:frontend

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
